version: "3.1"

stories:
  - story: Usuario elige opción problemas
    steps:
      - intent: opcion_problemas
      - action: utter_opcion_problemas

  - story: Usuario elige opción pagos
    steps:
      - intent: opcion_pagos
      - action: utter_opcion_pagos

  - story: Usuario elige agendar visita
    steps:
    - intent: greet
    - action: utter_greet
    - intent: opcion_agendar
    - action: simple_pizza_form
    - active_loop: simple_pizza_form
    - slot_was_set:
        - requested_slot: nombre_usuario
    - slot_was_set:
        - nombre_usuario: s
    - slot_was_set:
        - requested_slot: num_servicio
    - intent: stop
    - action: utter_ask_continue
    - intent: affirm
    - action: action_deactivate_loop
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: utter_submit
    - action: utter_pizza_slots
    - action: action_save_pizza_to_pdf
    - intent: goodbye
    - action: utter_goodbye

  - story: Usuario elige otros
    steps:
      - intent: opcion_otros
      - action: utter_opcion_otros

  - story: Regresar al menu principal desde cualquier punto
