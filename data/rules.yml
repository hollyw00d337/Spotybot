version: "3.1"
rules:
  - rule: Saludo inicial muestra menú
    steps:
      - intent: saludar
      - action: utter_saludar
      - action: utter_menu_principal

  - rule: Despedida
    steps:
      - intent: despedida
      - action: utter_despedida

  - rule: Elegir opción del menú
    steps:
      - intent: elegir_opcion
      - action: action_elegir_opcion

  - rule: Regresar al menú principal
    steps:
      - intent: regresar_menu
      - action: utter_menu_principal

  - rule: Activate Pizza Form
    steps:
      - intent: opcion_agendar
      - action: simple_pizza_form
      - active_loop: simple_pizza_form
  - rule: Submit Pizza Form and save to PDF
    condition:
      - active_loop: simple_pizza_form
    steps:
    - action: simple_pizza_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: utter_submit
    - action: utter_pizza_slots
    - action: action_save_pizza_to_pdf