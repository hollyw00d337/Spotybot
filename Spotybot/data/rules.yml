version: "3.1"

rules:

- rule: Selección de opción en cualquier menú
  steps:
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

- rule: Regresar al menú principal
  steps:
    - intent: regresar_menu
    - action: utter_menu_principal

- rule: Fallback personalizado
  steps: 
    - intent: fallback
    - action: action_fallback

- rule: Ayuda rápida después de fallback
  steps:
    - action: action_fallback
    - intent: regresar_menu
    - action: utter_menu_principal

- rule: Guardar cita y generar ticket
  steps:
    - active_loop: agendar_visita_form
    - action: action_guardar_cita_y_generar_ticket

- rule: Usuario dice que no funciono
  steps: 
    - intent: no_funciona
    - action: utter_contactar_soporte

- rule: Procesar datos para QR
  steps:
    - intent: datos_qr
    - action: action_procesar_datos_qr
