version: "3.1"

intents:
  - saludar
  - despedida
  - seleccionar_opcion
  - afirmar
  - negar
  - regresar_menu
  - fallback
  - dar_numero_cuenta
  - fecha_cita
  - no_funciona
  - no_funciona_el_mensaje_1
  - datos_qr

entities:
  - numero_opcion
  - numero_cuenta
  - fecha_cita

slots:
  estado_menu:
    type: text
    initial_value: menu_principal
    influence_conversation: true
    mappings:
      - type: custom
  numero_cuenta:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: numero_cuenta
  fecha_cita:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: fecha_cita

actions:
  - action_elegir_opcion
  - action_fallback
  - action_guardar_cita_y_generar_ticket
  - action_mostrar_planes_celular
  - action_generar_qr_pago
  - action_procesar_datos_qr
  - action_session_start

forms:
  agendar_visita_form:
    required_slots:
      - numero_cuenta
      - fecha_cita

responses:
  utter_saludar:
    - text: |
        ¡Hola! Soy Spotty, tu asistente digital. Estoy aquí para ayudarte sin interrupciones.
        Selecciona lo que necesites 👇

  utter_menu_principal:
    - text: |
        🧩 1. Problema con mi servicio
        💸 2. Pagos y facturación
        🛠 3. Agendar o cambiar visita
        📱 4. SpotMobile
        🎁 5. Conoce nuestros planes
        🗣 6. Otro asunto

  utter_opcion_problemas:
    - text: |
        🧩 Problemas con mi servicio
        1. Sin señal
        2. Intermitente
        3. Ya pagué pero sin servicio
        4. Técnico no dejó bien
        5. Regresar al menú principal

  utter_solucion_problemas_4:
    - text: "Lamento escuchar eso. Por favor comunícate al 614 399 00 92 para asistencia inmediata."

  utter_opcion_pagos:
    - text: |
        💸 Pagos y facturación
        1. Validar pago
        2. Consultar deuda
        3. Solicitar forma de pago
        4. Reactivar servicio
        5. Regresar al menú principal

  utter_opcion_agendar:
    - text: |
        🛠 Agendar o cambiar visita
        1. Agendar visita
        2. Cambiar domicilio
        3. Cancelar visita
        4. Confirmar cita
        5. Regresar al menú principal

  utter_opcion_celular:
    - text: |
        📱 SpotMobile
        1. Ver planes de celular
        2. Generar código QR de pago
        3. Dudas servicios
        4. Soporte
        5. Regresar al menú principal
  utter_solucion_problemas_3:
    - text: | 
        Lamento que aun no tengas servicio 


        Si ya relizaste el pago, entonces ahora mismo se esta acreditando 
        Manten a la mano tu recibo de pago 

        
        Si despues de un tiempo aun no se acredita, entonces contacta a servicio tecnico al 📞 614 399 00 92
        Estamos encantados de atenderte 😁
  utter_opcion_otros:
    - text: |
        🗣 Otro asunto
        1. Cancelar servicio
        2. Quejarme
        3. Saber más
        4. Comentario o sugerencia
        5. Regresar al menú principal
  utter_solucion_otros_3:
    - text: |
        En Spot Uno nos gusta conectar donde otros no se atreven.
            Nuestra misión es ofrecerte internet de alta velocidad y telefonía móvil donde más lo necesitas. 
            Pero no solo eso, con Spot Energy estamos listos para llevarte energía donde el resto no llega. 
            Porque sabemos que tu vida debe ir sin interrupciones.


        Lo que nos diferencia
        ✨ Cobertura donde nadie más llega
        ✨ Soporte real, siempre disponible
        ✨ Planes que se adaptan a tu vida, sin letras chiquitas
        ✨ Planes de internet y telefonia móvil (Doble Play)
        ✨ Personal capacitado que entiende tus necesidades

  utter_seleccion_planes:
    - text: |
        ¡Tenemos los mejores planes!
        ¡Obten el que mas te guste!


        Spotty10
        $320/mes


        🛜 Perfecto para navegar, redes sociales y YouTube en HD.
        Disfruta clases en línea, reuniones o series sin interrupciones.
        10 Mbps de velocidad + descargas ilimitadas.


        ✨¡POPULAR!✨
        Spotty20
        $360/mes
        

        ⚡️ Transmite en 4K y juega en línea sin lag.
        Hasta 5 dispositivos conectados al mismo tiempo sin perder velocidad.
        20 Mbps con experiencia mejorada y sin interrupciones.


        MySpotty
        Personaliza tu plan 
        

        ⚒️ ¿Necesitas más velocidad o estabilidad? Ármalo a tu medida.
        Desde 30 Mbps hasta 1000 Mbps o más, según tus necesidades.
        ¡Configúralo en menos de 2 minutos! Sin sorpresas en el precio.


        CONTRATA AHORA 
        Whatsapp | 📞 614 399 00 92

        https://wa.me/526146071503?text=Estoy%20interesado%20en%20el%20paquete%20Básico


        Sin costo de Instalación *
        

  utter_solucion_problemas_1:
    - text: "Por favor, verifica que el módem esté prendido y reinicia si es necesario. Si el problema persiste, contacta a soporte técnico al 614 399 00 92."
  utter_solucion_problemas_2:
    - text: "Tu conexión está intermitente. Intenta reiniciar tu equipo. Si el problema continúa, llama al soporte técnico al 614 399 00 92."
  utter_solucion_celular_1:
    - text: "¡Perfecto! Te voy a mostrar todos nuestros planes de celular disponibles."
  utter_solucion_celular_2:
    - text: |
        💡 Para ahorrar luz, contáctanos para más información sobre Spot Energy:
        📞 614 399 00 92
        📧 contrataciones@spotuno.mx
        
        Spot Energy - Energía donde otros no llegan
  utter_solucion_celular_3:
    - text: |
        📱 Dudas sobre servicios celulares:
        
        En SpotUno ofrecemos:
        • Planes de datos ilimitados
        • Cobertura donde otros no llegan
        • Soporte técnico especializado
        • Planes Doble Play (Internet + Celular)
        
        Para más información: 📞 614 399 00 92
  
  utter_planes_celular:
    - text: |
        📱 ¡Conéctate con Spot1Mobile y #ViveSinInterrupciones!
        Paquete S1 M30 – $30 / 3 días
        ✅ 2 GB totales
        ✅ Redes sociales ilimitadas
        ✅ 63 minutos + 63 SMS
        📌 Ideal para emergencias o conexión corta.

        Paquete S1 M100 – $100 / 30 días
        ✅ 2 GB + redes sociales ilimitadas
        ✅ 1,500 minutos + 250 SMS 
        💡 Perfecto si usas apps básicas y redes.

        Paquete S1 M120 – $120 / 30 días
        ✅ 4 GB totales
        ✅ 1,500 minutos + 250 SMS
        ✅ Compartición de datos
        🎥 Para quienes navegan, ven videos o hacen videollamadas.

        Paquete S1 M220 – $220 / 30 días
        ✅ ¡24.5 GB totales!
        ✅ 1,500 minutos + 250 SMS
        ✅ Comparte tus datos
        ⚡¡Potencia para gamers, trabajo remoto o compartir internet!
        Pregunta por disponibilidad y activa el tuyo hoy mismo.

  utter_qr_pago_generado:
    - text: |
        📱 CÓDIGO QR PARA PAGO 📱
        
        Escanea el siguiente código QR con tu app bancaria:
        
        [QR_CODE_PLACEHOLDER]
        
        💳 Información de pago:
        • Beneficiario: SpotUno Telecomunicaciones
        • Concepto: Pago de servicios
        • Referencia: Tu número de cuenta
        
        📝 También puedes pagar con estos datos:
        • CLABE: 0123456789012345678
        • Banco: Banco Nacional
        • Cuenta: 1234567890
        
        ⚠️ IMPORTANTE:
        • Guarda tu comprobante de pago
        • El servicio se activa en 24-48 hrs
        • Para dudas: 📞 614 399 00 92

  utter_solicitar_datos_qr:
    - text: |
        📱 GENERAR CÓDIGO QR DE PAGO 📱
        
        Para generar tu código QR personalizado, necesito los siguientes datos:
        
        📝 Envía tus datos en este formato exacto:
        NombreCompleto|MontoAPagar|ConceptoDePago
        
        🔹 Ejemplos:
        • Juan Pérez|500|Pago internet enero
        • María González|120|Pago S1 M120
        • Carlos López|220|Pago S1 M220
        
        ⚠️ IMPORTANTE:
        • Separa los datos con el símbolo |
        • No uses espacios antes o después del |
        • El monto debe ser solo números
        • Recibirás un link con tu código QR personalizado
        
        📞 ¿Dudas? Llama al 614 399 00 92

  utter_formato_datos_incorrecto:
    - text: |
        ❌ FORMATO INCORRECTO
        
        Por favor, envía tus datos en el formato correcto:
        NombreCompleto|MontoAPagar|ConceptoDePago
        
        🔹 Ejemplo:
        María González|320|Pago plan Spotty10
        
        📝 Recuerda:
        • Separar con el símbolo |
        • Monto solo números
        • Sin espacios extras
  utter_solucion_celular_4:
    - text: "Para soporte técnico de tu celular, por favor contáctanos al 614 399 00 92."

  utter_fallback_custom:
    - text: "No entendí tu mensaje. Puedes elegir una opción del menú escribiendo el número o palabra clave."
    - text: "Disculpa, no entendí. Puedes escribir un número del menú o decir 'menú' para ver las opciones principales."
    - text: "Lo siento, no pude comprender. Intenta escribir el número de la opción que te interesa o di 'volver al menú'."

  utter_contactar_soporte:
    - text: "Lamento escuchar eso. Por favor comunícate al 614 399 00 92 para asistencia inmediata."

  utter_solucion_otros_4:
    - text: ¿Quieres mandarnos un comentario o sugerencia? Envianos un e-mail contrataciones@spotuno.mx
  
  utter_solucion_otros_2:
    - text: |
        Lamentamos mucho que tengas alguna queja 


        Envianos tu queja por vía e-mail contrataciones@spotuno.mx
  utter_solucion_otros_1:
    - text: |
        Para cancelar tu servicio, puedes contactarnos al numero 614 399 00 92
  
  utter_solucion_agendar_1:
    - text: Para agendar una cita, puedes contactarnos al numero 614 399 00 92 o por nuestro e-main contrataciones@spotuno.mx
  
  utter_solucion_agendar_2:
    - text: Si quieres cambiar tu domicilio, puedes contactarnos al numero 614 399 00 92 o por nuestro e-main contrataciones@spotuno.mx
  
  utter_solucion_agendar_3:
   - text: Para cancelar tu visita, puedes contactacrnos al numero 614 399 00 92 y proporciona los datos con los que contrataste tu cita para proceder con la cancelacion.
  


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
  action_session_start: action_session_start
  utter_session_expired:
    - text: "Tu sesión ha expirado. Por favor, inicia de nuevo."
